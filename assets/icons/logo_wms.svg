<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Box Base (Diamond top face) -->
  <path
    d="M 12 28 L 32 38 L 52 28 L 32 18 Z"
    stroke="#2563EB"
    stroke-width="3.5"
    stroke-linejoin="round"
  />
  <!-- Box Sides (left + right + bottom edges) -->
  <path
    d="M 12 28 L 12 48 L 32 58 L 52 48 L 52 28"
    stroke="#1D4ED8"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Center vertical line -->
  <path
    d="M 32 38 L 32 58"
    stroke="#1D4ED8"
    stroke-width="3.5"
    stroke-linecap="round"
  />
  <!-- Top Flap Left (open lid) -->
  <path
    d="M 12 28 L 4 18 L 24 8 L 32 18"
    stroke="#3B82F6"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Top Flap Right (open lid) -->
  <path
    d="M 52 28 L 60 18 L 40 8 L 32 18"
    stroke="#3B82F6"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Arrow Up (panah keluar/kelola stok) -->
  <path
    d="M 32 44 L 32 20 M 32 20 L 25 27 M 32 20 L 39 27"
    stroke="#1D4ED8"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
